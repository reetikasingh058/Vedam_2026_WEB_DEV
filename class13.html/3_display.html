<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .block,
    .inline,
    .inline_block {
        font-weight: bold;
        font-family: sans-serif;
    }


    /* template starts from here */
    .block {
        display:block;
        /* height, width, p,m,border */
        background-color: lightblue;
        padding:20px;
        height:100px;
        width:100px;
     width:100px;
     border: 1px solid red;
     margin:20px;
    }

    .inline {
        display: inline;
        background-color: lightgreen;
         padding:20px;
         height:100px;
         width:100px;
         border: 1px solid red;
          margin:20px;

    }

    .inline_block {
        display:inline-block;
        background-color:mediumorchid;  
        
        height:100px;
        width:100px;
        border: 1px solid red;
         margin:20px;
         padding:20px;

    }
</style>

<body>
<!--block-->
    <h2> hello from h2</h2>
    <div class="block">hello hi how are you</div>
    <div class="block">hello hi how are you</div>
    

    <!-- inline-->
     <div class="inline"> i am inline</div>
      <div class="inline"> i am inline</div>

      <!-- inline block-->
       <div class="inline_block"> i am inline block</div>
       <div class="inline_block"> i am inline block</div>
</body>

</html>

<!--
bLock:
1. next element →> new line
2. padding: apply in all directions
3. height: works
4. uwidth : works
5. margin :works
6. border: apply in all directions 


inline:
1. next element →> in same line
2. padding: apply in all directions
3. uheight: not works
4. uwidth : not works
5. margin: only works horizontally
6. border: apply in all directions


 inline-block:
1. next element →> in same line
2. padding: apply in all directions
3. uheight: works
4. uwidth: works
5. margin: works
6. border: apply in all directions



-->
